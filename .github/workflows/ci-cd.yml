  compatibility-check:
    name: 环境兼容性检查
    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
      - name: 缓存依赖
        uses: actions/cache@v4
        with:
          path: |-
            ~/.npm
            ~/.pnpm-store
            node_modules
            .next/cache
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json', '**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-node-
      - name: 安装依赖
        run: |-
          set +e
          for i in {1..3}; do
            echo "🔄 尝试第 $i 次..."
            npm ci
            if [ $? -eq 0 ]; then
              echo "✅ 成功"
              break
            else
              echo "❌ 失败，等待重试..."
              sleep $((i * 5))
            fi
          done
          set -e
      - name: 运行环境兼容性检查
        run: |-
          echo "🔍 检查开发环境兼容性..."

          # 运行环境兼容性检查器
          node scripts/tools/environment-compatibility-checker.js

          # 检查 Claude Code 兼容性
          echo "🤖 检查 Claude Code 兼容性..."
          if command -v claude &> /dev/null; then
            echo "✅ Claude CLI 已安装"
            claude --version || echo "⚠️  Claude CLI 版本检查失败"
          else
            echo "ℹ️  Claude CLI 未安装（可选）"
          fi

          # 检查 Gemini CLI 兼容性
          echo "🔮 检查 Gemini CLI 兼容性..."
          if command -v gemini &> /dev/null; then
            echo "✅ Gemini CLI 已安装"
            gemini --version || echo "⚠️  Gemini CLI 版本检查失败"
          else
            echo "ℹ️  Gemini CLI 未安装（可选）"
          fi

          # 检查项目配置
          echo "⚙️  检查项目配置..."
          if [ -f package.json ]; then
            echo "✅ package.json 存在"
            npm run tools:status || echo "⚠️  工具状态检查失败"
          fi

          echo "✅ 环境兼容性检查完成"
      - name: 上传兼容性报告
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: compatibility-report
          path: reports/environment-compatibility.json
      - name: 失败诊断
        if: failure()
        run: |-
          echo "🔍 收集失败诊断信息..."

          # 系统信息
          echo "📊 系统信息:"
          uname -a
          df -h
          free -h

          # Node.js 环境
          echo "📦 Node.js 环境:"
          node --version
          npm --version
          npm config list

          # 项目状态
          echo "📁 项目状态:"
          ls -la
          if [ -f package.json ]; then
            echo "📄 package.json 存在"
            cat package.json | jq '.scripts' || echo "无法解析 scripts"
          fi

          # 日志文件
          echo "📋 查找日志文件:"
          find . -name "*.log" -type f -exec echo "发现日志: {}" \; -exec tail -20 {} \;

          # 错误报告
          echo "📊 生成错误报告..."
          mkdir -p reports/diagnostics
          echo "$(date): CI/CD 流程失败" > reports/diagnostics/failure-$(date +%Y%m%d-%H%M%S).log
    strategy:
      matrix:
        node-version:
          - 18.x
          - 20.x
          - 22.x
        os:
          - ubuntu-latest
      fail-fast: false
permissions:
  contents: read
  security-events: write
  actions: read
  checks: write
  pull-requests: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

name: CI/CD Pipeline
'on':
  push:
    branches:
      - main
      - develop
    tags:
      - v*
    paths:
      - src/**
      - package*.json
      - .github/workflows/**
  pull_request:
    branches:
      - main
      - develop
    paths:
      - src/**
      - package*.json
      - .github/workflows/**
  schedule:
    - cron: 0 2 * * *
env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8'
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  OPTIMIZED_BY: ZK-Agent Pipeline Optimizer
  OPTIMIZED_AT: '2025-07-22T05:22:51.992Z'
  TOKEN_LIMIT_AWARE: 'true'
jobs:
  code-quality:
    name: 代码质量检查
    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: 安装 pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: 获取 pnpm store 目录
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - name: 缓存 pnpm 依赖
        uses: actions/cache@v3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: 安装依赖
        run: |-
          set +e
          for i in {1..3}; do
            echo "🔄 尝试第 $i 次..."
            pnpm install --frozen-lockfile
            if [ $? -eq 0 ]; then
              echo "✅ 成功"
              break
            else
              echo "❌ 失败，等待重试..."
              sleep $((i * 5))
            fi
          done
          set -e
      - name: 类型检查
        run: pnpm type-check
      - name: 代码格式检查
        run: pnpm lint
      - name: 代码格式化检查
        run: pnpm format:check
      - name: 依赖安全审计
        run: pnpm audit --audit-level high
      - name: 许可证检查
        run: pnpm license-check
      - name: 失败诊断
        if: failure()
        run: |-
          echo "🔍 收集失败诊断信息..."

          # 系统信息
          echo "📊 系统信息:"
          uname -a
          df -h
          free -h

          # Node.js 环境
          echo "📦 Node.js 环境:"
          node --version
          npm --version
          npm config list

          # 项目状态
          echo "📁 项目状态:"
          ls -la
          if [ -f package.json ]; then
            echo "📄 package.json 存在"
            cat package.json | jq '.scripts' || echo "无法解析 scripts"
          fi

          # 日志文件
          echo "📋 查找日志文件:"
          find . -name "*.log" -type f -exec echo "发现日志: {}" \; -exec tail -20 {} \;

          # 错误报告
          echo "📊 生成错误报告..."
          mkdir -p reports/diagnostics
          echo "$(date): CI/CD 流程失败" > reports/diagnostics/failure-$(date +%Y%m%d-%H%M%S).log
    needs:
      - compatibility-check
    strategy:
      matrix:
        node-version:
          - 18.x
          - 20.x
          - 22.x
        os:
          - ubuntu-latest
      fail-fast: false
  unit-tests:
    name: 单元测试
    runs-on: ubuntu-latest
    needs:
      - compatibility-check
      - code-quality
    strategy:
      matrix:
        node-version:
          - 18
          - 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置 Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: 缓存依赖
        uses: actions/cache@v4
        with:
          path: |-
            ~/.npm
            ~/.pnpm-store
            node_modules
            .next/cache
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json', '**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-node-
      - name: 安装 pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: 安装依赖
        run: |-
          set +e
          for i in {1..3}; do
            echo "🔄 尝试第 $i 次..."
            pnpm install --frozen-lockfile
            if [ $? -eq 0 ]; then
              echo "✅ 成功"
              break
            else
              echo "❌ 失败，等待重试..."
              sleep $((i * 5))
            fi
          done
          set -e
      - name: 运行单元测试
        run: |-
          set +e
          for i in {1..3}; do
            echo "🔄 尝试第 $i 次..."
            pnpm test:unit:coverage
            if [ $? -eq 0 ]; then
              echo "✅ 成功"
              break
            else
              echo "❌ 失败，等待重试..."
              sleep $((i * 5))
            fi
          done
          set -e
      - name: 上传测试覆盖率
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info
          flags: unit-tests
          name: codecov-umbrella
      - name: 失败诊断
        if: failure()
        run: |-
          echo "🔍 收集失败诊断信息..."

          # 系统信息
          echo "📊 系统信息:"
          uname -a
          df -h
          free -h

          # Node.js 环境
          echo "📦 Node.js 环境:"
          node --version
          npm --version
          npm config list

          # 项目状态
          echo "📁 项目状态:"
          ls -la
          if [ -f package.json ]; then
            echo "📄 package.json 存在"
            cat package.json | jq '.scripts' || echo "无法解析 scripts"
          fi

          # 日志文件
          echo "📋 查找日志文件:"
          find . -name "*.log" -type f -exec echo "发现日志: {}" \; -exec tail -20 {} \;

          # 错误报告
          echo "📊 生成错误报告..."
          mkdir -p reports/diagnostics
          echo "$(date): CI/CD 流程失败" > reports/diagnostics/failure-$(date +%Y%m%d-%H%M%S).log
      - name: 发布测试报告
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Jest Tests
          path: reports/jest-*.xml
          reporter: jest-junit
  integration-tests:
    name: 集成测试
    runs-on: ${{ matrix.os }}
    needs:
      - compatibility-check
      - code-quality
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zk_agent_test
        options: '--health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5'
        ports:
          - '5432:5432'
      redis:
        image: redis:7
        options: '--health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5'
        ports:
          - '6379:6379'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: 缓存依赖
        uses: actions/cache@v4
        with:
          path: |-
            ~/.npm
            ~/.pnpm-store
            node_modules
            .next/cache
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json', '**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-node-
      - name: 安装 pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: 安装依赖
        run: |-
          set +e
          for i in {1..3}; do
            echo "🔄 尝试第 $i 次..."
            pnpm install --frozen-lockfile
            if [ $? -eq 0 ]; then
              echo "✅ 成功"
              break
            else
              echo "❌ 失败，等待重试..."
              sleep $((i * 5))
            fi
          done
          set -e
      - name: 设置测试环境
        run: |-
          set +e
          for i in {1..3}; do
            echo "🔄 尝试第 $i 次..."
            cp .env.example .env.test
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/zk_agent_test" >> .env.test
          echo "REDIS_URL=redis://localhost:6379" >> .env.test

            if [ $? -eq 0 ]; then
              echo "✅ 成功"
              break
            else
              echo "❌ 失败，等待重试..."
              sleep $((i * 5))
            fi
          done
          set -e
      - name: 数据库迁移
        run: pnpm db:migrate:test
      - name: 运行集成测试
        run: |-
          set +e
          for i in {1..3}; do
            echo "🔄 尝试第 $i 次..."
            pnpm test:integration
            if [ $? -eq 0 ]; then
              echo "✅ 成功"
              break
            else
              echo "❌ 失败，等待重试..."
              sleep $((i * 5))
            fi
          done
          set -e
      - name: 失败诊断
        if: failure()
        run: |-
          echo "🔍 收集失败诊断信息..."

          # 系统信息
          echo "📊 系统信息:"
          uname -a
          df -h
          free -h

          # Node.js 环境
          echo "📦 Node.js 环境:"
          node --version
          npm --version
          npm config list

          # 项目状态
          echo "📁 项目状态:"
          ls -la
          if [ -f package.json ]; then
            echo "📄 package.json 存在"
            cat package.json | jq '.scripts' || echo "无法解析 scripts"
          fi

          # 日志文件
          echo "📋 查找日志文件:"
          find . -name "*.log" -type f -exec echo "发现日志: {}" \; -exec tail -20 {} \;

          # 错误报告
          echo "📊 生成错误报告..."
          mkdir -p reports/diagnostics
          echo "$(date): CI/CD 流程失败" > reports/diagnostics/failure-$(date +%Y%m%d-%H%M%S).log
      - name: 发布测试报告
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Jest Tests
          path: reports/jest-*.xml
          reporter: jest-junit
    strategy:
      matrix:
        node-version:
          - 18.x
          - 20.x
          - 22.x
        os:
          - ubuntu-latest
      fail-fast: false
  e2e-tests:
    name: E2E 测试
    runs-on: ${{ matrix.os }}

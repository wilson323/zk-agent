          uname -a
          df -h
          free -h

          # Node.js 环境
          echo "📦 Node.js 环境:"
          node --version
          npm --version
          npm config list

          # 项目状态
          echo "📁 项目状态:"
          ls -la
          if [ -f package.json ]; then
            echo "📄 package.json 存在"
            cat package.json | jq '.scripts' || echo "无法解析 scripts"
          fi

          # 日志文件
          echo "📋 查找日志文件:"
          find . -name "*.log" -type f -exec echo "发现日志: {}" \; -exec tail -20 {} \;

          # 错误报告
          echo "📊 生成错误报告..."
          mkdir -p reports/diagnostics
          echo "$(date): CI/CD 流程失败" > reports/diagnostics/failure-$(date +%Y%m%d-%H%M%S).log
      - name: 发布测试报告
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Jest Tests
          path: reports/jest-*.xml
          reporter: jest-junit
    strategy:
      matrix:
        node-version:
          - 18.x
          - 20.x
          - 22.x
        os:
          - ubuntu-latest
      fail-fast: false
  security-scan:
    name: 安全扫描
    runs-on: ubuntu-latest
    needs:
      - compatibility-check
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 运行 Trivy 漏洞扫描
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
      - name: 上传 Trivy 扫描结果
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: trivy-results.sarif
      - name: 运行 CodeQL 分析
        uses: github/codeql-action/analyze@v2
        with:
          languages: javascript
      - name: 失败诊断
        if: failure()
        run: |-
          echo "🔍 收集失败诊断信息..."

          # 系统信息
          echo "📊 系统信息:"
          uname -a
          df -h
          free -h

          # Node.js 环境
          echo "📦 Node.js 环境:"
          node --version
          npm --version
          npm config list

          # 项目状态
          echo "📁 项目状态:"
          ls -la
          if [ -f package.json ]; then
            echo "📄 package.json 存在"
            cat package.json | jq '.scripts' || echo "无法解析 scripts"
          fi

          # 日志文件
          echo "📋 查找日志文件:"
          find . -name "*.log" -type f -exec echo "发现日志: {}" \; -exec tail -20 {} \;

          # 错误报告
          echo "📊 生成错误报告..."
          mkdir -p reports/diagnostics
          echo "$(date): CI/CD 流程失败" > reports/diagnostics/failure-$(date +%Y%m%d-%H%M%S).log
  performance-tests:
    name: 性能测试
    runs-on: ${{ matrix.os }}
    needs:
      - compatibility-check
      - unit-tests
      - integration-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: 缓存依赖
        uses: actions/cache@v4
        with:
          path: |-
            ~/.npm
            ~/.pnpm-store
            node_modules
            .next/cache
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json', '**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-node-
      - name: 安装 pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: 安装依赖
        run: |-
          set +e
          for i in {1..3}; do
            echo "🔄 尝试第 $i 次..."
            pnpm install --frozen-lockfile
            if [ $? -eq 0 ]; then
              echo "✅ 成功"
              break
            else
              echo "❌ 失败，等待重试..."
              sleep $((i * 5))
            fi
          done
          set -e
      - name: 构建应用
        run: |-
          set +e
          for i in {1..3}; do
            echo "🔄 尝试第 $i 次..."
            pnpm build
            if [ $? -eq 0 ]; then
              echo "✅ 成功"
              break
            else
              echo "❌ 失败，等待重试..."
              sleep $((i * 5))
            fi
          done
          set -e
      - name: 运行性能测试
        run: |-
          set +e
          for i in {1..3}; do
            echo "🔄 尝试第 $i 次..."
            pnpm test:performance
            if [ $? -eq 0 ]; then
              echo "✅ 成功"
              break
            else
              echo "❌ 失败，等待重试..."
              sleep $((i * 5))
            fi
          done
          set -e
      - name: 上传性能测试报告
        uses: actions/upload-artifact@v3
        with:
          name: performance-report
          path: performance-report/
          retention-days: 30
      - name: 失败诊断
        if: failure()
        run: |-
          echo "🔍 收集失败诊断信息..."

          # 系统信息
          echo "📊 系统信息:"
          uname -a
          df -h
          free -h

          # Node.js 环境
          echo "📦 Node.js 环境:"
          node --version
          npm --version
          npm config list

          # 项目状态
          echo "📁 项目状态:"
          ls -la
          if [ -f package.json ]; then
            echo "📄 package.json 存在"
            cat package.json | jq '.scripts' || echo "无法解析 scripts"
          fi

          # 日志文件
          echo "📋 查找日志文件:"
          find . -name "*.log" -type f -exec echo "发现日志: {}" \; -exec tail -20 {} \;

          # 错误报告
          echo "📊 生成错误报告..."
          mkdir -p reports/diagnostics
          echo "$(date): CI/CD 流程失败" > reports/diagnostics/failure-$(date +%Y%m%d-%H%M%S).log

# Kubernetes 部署配置文件
# 用于在 Kubernetes 集群中部署多智能体系统

apiVersion: v1
kind: Namespace
metadata:
  name: multi-agent-system
  labels:
    name: multi-agent-system
    environment: production

---
# ConfigMap 用于存储非敏感配置
apiVersion: v1
kind: ConfigMap
metadata:
  name: multi-agent-config
  namespace: multi-agent-system
data:
  ENVIRONMENT: 'production'
  DEBUG: 'false'
  HOST: '0.0.0.0'
  PORT: '8000'
  WORKERS: '4'
  LOG_LEVEL: 'INFO'
  ENABLE_METRICS: 'true'
  METRICS_PORT: '9090'
  ENABLE_HEALTH_CHECK: 'true'
  HEALTH_CHECK_INTERVAL: '30'
  MAX_CONCURRENT_AGENTS: '50'
  MESSAGE_QUEUE_SIZE: '1000'
  TASK_TIMEOUT: '300'
  HEARTBEAT_INTERVAL: '30'
  CACHE_ENABLED: 'true'
  CACHE_TTL: '3600'
  ENABLE_AUTOGEN: 'true'
  ENABLE_CREWAI: 'true'
  ENABLE_LANGGRAPH: 'true'
  ENABLE_WEB_UI: 'true'
  ENABLE_API_DOCS: 'true'

---
# Secret 用于存储敏感信息
apiVersion: v1
kind: Secret
metadata:
  name: multi-agent-secrets
  namespace: multi-agent-system
type: Opaque
data:
  # 注意：这些值需要进行 base64 编码
  # 使用命令：echo -n "your-secret-value" | base64
  SECRET_KEY: eW91ci1zZWNyZXQta2V5LWNoYW5nZS1pbi1wcm9kdWN0aW9uLW11c3QtYmUtMzItY2hhcmFjdGVycy1sb25n
  OPENAI_API_KEY: eW91cl9vcGVuYWlfYXBpX2tleV9oZXJl
  DATABASE_PASSWORD: cGFzc3dvcmQ=
  REDIS_PASSWORD: cmVkaXNfcGFzc3dvcmQ=
  JWT_SECRET: and1dC1zZWNyZXQta2V5

---
# PersistentVolumeClaim 用于数据持久化
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: multi-agent-data-pvc
  namespace: multi-agent-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: fast-ssd

---
# PersistentVolumeClaim 用于日志存储
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: multi-agent-logs-pvc
  namespace: multi-agent-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard

---
# PostgreSQL 数据库部署
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: multi-agent-system
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: 'multi_agent_db'
            - name: POSTGRES_USER
              value: 'postgres'
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: multi-agent-secrets
                  key: DATABASE_PASSWORD
            - name: PGDATA
              value: '/var/lib/postgresql/data/pgdata'
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: '256Mi'
              cpu: '250m'
            limits:
              memory: '512Mi'
              cpu: '500m'
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: multi-agent-data-pvc

---
# PostgreSQL 服务
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: multi-agent-system
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP

---
# Redis 部署
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: multi-agent-system
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          command:
            - redis-server
            - --requirepass
            - $(REDIS_PASSWORD)
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: multi-agent-secrets
                  key: REDIS_PASSWORD
          resources:
            requests:
              memory: '128Mi'
              cpu: '100m'
            limits:
              memory: '256Mi'
              cpu: '200m'
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5

---
# Redis 服务
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: multi-agent-system
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
  type: ClusterIP

---
# 多智能体系统主应用部署
apiVersion: apps/v1
kind: Deployment
metadata:
  name: multi-agent-app
  namespace: multi-agent-system
  labels:
    app: multi-agent-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: multi-agent-app
  template:
    metadata:
      labels:
        app: multi-agent-app
    spec:
      containers:
        - name: multi-agent-app
          image: multi-agent-system:latest
          ports:
            - containerPort: 8000
            - containerPort: 9090 # Metrics port
          env:
            # 从 ConfigMap 加载配置
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: multi-agent-config
                  key: ENVIRONMENT
            - name: DEBUG
              valueFrom:
                configMapKeyRef:
                  name: multi-agent-config
                  key: DEBUG
            - name: HOST
              valueFrom:
                configMapKeyRef:
                  name: multi-agent-config
                  key: HOST
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: multi-agent-config
                  key: PORT
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: multi-agent-config
                  key: LOG_LEVEL
            # 从 Secret 加载敏感信息
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: multi-agent-secrets
                  key: SECRET_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: multi-agent-secrets
                  key: OPENAI_API_KEY
            # 数据库连接
            - name: DATABASE_URL
              value: 'postgresql://postgres:$(DATABASE_PASSWORD)@postgres-service:5432/multi_agent_db'
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: multi-agent-secrets
                  key: DATABASE_PASSWORD
            # Redis 连接
            - name: REDIS_URL
              value: 'redis://:$(REDIS_PASSWORD)@redis-service:6379/0'
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: multi-agent-secrets
                  key: REDIS_PASSWORD
          volumeMounts:
            - name: data-storage
              mountPath: /app/data
            - name: logs-storage
              mountPath: /app/logs
            - name: temp-storage
              mountPath: /app/temp
          resources:
            requests:
              memory: '512Mi'
              cpu: '500m'
            limits:
              memory: '2Gi'
              cpu: '1000m'
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /startup
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
      volumes:
        - name: data-storage
          persistentVolumeClaim:
            claimName: multi-agent-data-pvc
        - name: logs-storage
          persistentVolumeClaim:
            claimName: multi-agent-logs-pvc
        - name: temp-storage
          emptyDir: {}
      initContainers:
        - name: wait-for-postgres
          image: postgres:15-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres-service -p 5432 -U postgres; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
              echo "PostgreSQL is ready!"
        - name: wait-for-redis
          image: redis:7-alpine
          command:
            - sh
            - -c
            - |
              until redis-cli -h redis-service -p 6379 ping; do
                echo "Waiting for Redis..."
                sleep 2
              done
              echo "Redis is ready!"
        - name: migrate-database
          image: multi-agent-system:latest
          command:
            - python
            - -c
            - |
              import asyncio
              from config import ConfigManager

              async def migrate():
                  config = ConfigManager()
                  # 这里添加数据库迁移逻辑
                  print("Database migration completed")

              asyncio.run(migrate())
          env:
            - name: DATABASE_URL
              value: 'postgresql://postgres:$(DATABASE_PASSWORD)@postgres-service:5432/multi_agent_db'
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: multi-agent-secrets
                  key: DATABASE_PASSWORD

---
# 多智能体系统服务
apiVersion: v1
kind: Service
metadata:
  name: multi-agent-service
  namespace: multi-agent-system
  labels:
    app: multi-agent-app
spec:
  selector:
    app: multi-agent-app
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
  type: ClusterIP

---
# Ingress 配置
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: multi-agent-ingress
  namespace: multi-agent-system
  annotations:
    kubernetes.io/ingress.class: 'nginx'
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
    cert-manager.io/cluster-issuer: 'letsencrypt-prod'
    nginx.ingress.kubernetes.io/rate-limit: '100'
    nginx.ingress.kubernetes.io/rate-limit-window: '1m'
spec:
  tls:
    - hosts:
        - multi-agent.your-domain.com
      secretName: multi-agent-tls
  rules:
    - host: multi-agent.your-domain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: multi-agent-service
                port:
                  number: 80
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: multi-agent-service
                port:
                  number: 9090

---
# HorizontalPodAutoscaler 自动扩缩容
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: multi-agent-hpa
  namespace: multi-agent-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: multi-agent-app
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Max

---
# PodDisruptionBudget 确保高可用性
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: multi-agent-pdb
  namespace: multi-agent-system
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: multi-agent-app

---
# ServiceMonitor 用于 Prometheus 监控
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: multi-agent-monitor
  namespace: multi-agent-system
  labels:
    app: multi-agent-app
spec:
  selector:
    matchLabels:
      app: multi-agent-app
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s

---
# NetworkPolicy 网络安全策略
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: multi-agent-network-policy
  namespace: multi-agent-system
spec:
  podSelector:
    matchLabels:
      app: multi-agent-app
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
        - podSelector:
            matchLabels:
              app: multi-agent-app
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 9090
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    - to: [] # 允许访问外部 API
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80

---
# RBAC 配置
apiVersion: v1
kind: ServiceAccount
metadata:
  name: multi-agent-sa
  namespace: multi-agent-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: multi-agent-role
  namespace: multi-agent-system
rules:
  - apiGroups: ['']
    resources: ['pods', 'services', 'configmaps', 'secrets']
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['apps']
    resources: ['deployments']
    verbs: ['get', 'list', 'watch']

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: multi-agent-rolebinding
  namespace: multi-agent-system
subjects:
  - kind: ServiceAccount
    name: multi-agent-sa
    namespace: multi-agent-system
roleRef:
  kind: Role
  name: multi-agent-role
  apiGroup: rbac.authorization.k8s.io
